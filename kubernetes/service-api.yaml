apiVersion: v1
kind: Service
metadata:
  name: kuberag-api-service
  namespace: kuberag
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  selector:
    app: kuberag-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP